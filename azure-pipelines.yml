trigger:
  - main

variables:
  # Link to your Azure DevOps Variable Group
  - group: 'Spfx-Extensions-Variables'

stages:
  # =========================================================================
  # 1. CI STAGE: Versioning, Heft Build & Artifact Creation
  # =========================================================================
  - stage: BuildStage
    displayName: 'CI - Build SPFx Package'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Install Node.js 22'

          # Auto-Increment Version Script (using Azure DevOps BuildId)
          - script: |
              node -e "
              const fs = require('fs');
              const path = './config/package-solution.json';
              
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              
              const currentVersion = data.solution.version || '1.0.0.0';
              const versionParts = currentVersion.split('.');
              const major = versionParts[0] || '1';
              const minor = versionParts[1] || '0';
              
              const azureBuildId = '$(Build.BuildId)';
              data.solution.version = \`\${major}.\${minor}.\${azureBuildId}.0\`;
              
              fs.writeFileSync(path, JSON.stringify(data, null, 2));
              console.log('Successfully updated SPFx solution version to: ' + data.solution.version);
              "
            displayName: 'Auto-Increment Solution Version'

          - script: npm ci
            displayName: 'Install dependencies (npm ci)'

          - script: npx heft test --clean --production
            displayName: 'Heft Build & Test (Production)'

          - script: npx heft package-solution --production
            displayName: 'Heft Package Solution (Production)'

          # Dynamic *.sppkg Name Finder Script
          - script: |
              CMD_GET_SPPKG_NAME=$(find ./sharepoint/solution -name "*.sppkg" -exec basename {} \;)
              echo "Found package filename: $CMD_GET_SPPKG_NAME"
              echo "##vso[task.setvariable variable=SpPkgFileName;isOutput=true]$CMD_GET_SPPKG_NAME"
            displayName: 'Get generated *.sppkg filename'
            name: GetSharePointPackage

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.Repository.LocalPath)/sharepoint/solution'
              artifact: 'drop'
              publishLocation: 'pipeline'
            displayName: 'Publish Package Artifact'

  # =========================================================================
  # 2. CD STAGE: Automated Deployment to SharePoint
  # =========================================================================
  - stage: DeployStage
    displayName: 'CD - Deploy to SharePoint'
    dependsOn: BuildStage
    condition: succeeded()
    variables:
      DynamicSpPkgName: $[ stageDependencies.BuildStage.BuildJob.outputs['GetSharePointPackage.SpPkgFileName'] ]
    jobs:
      - job: DeployJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'
            displayName: 'Download Package Artifact'

          - task: DownloadSecureFile@1
            name: spfxCertFile
            inputs:
              secureFile: 'SPFxPipeline.pfx'
            displayName: 'Download PFX Certificate File'

          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Install Node.js 22 for Deployment'

          - script: npm install -g @pnp/cli-microsoft365
            displayName: 'Install CLI for Microsoft 365'

          # 1. Authenticate with SharePoint via Entra App Registration
          - script: |
              m365 login --authType certificate --appId "$(spfx_client_id)" --tenant "$(spfx_tenant_id)" --certificateFile "$(spfxCertFile.secureFilePath)" --password "$(spfx_cert_password)"
            displayName: 'Authenticate with SharePoint'

          # 2. Set SharePoint Context URL
          - script: |
              m365 spo set --url "$(SiteUrl)"
            displayName: 'Set SharePoint Context URL'

          # 3. Upload Package to App Catalog
          - script: |
              m365 spo app add --filePath "$(Pipeline.Workspace)/drop/$(DynamicSpPkgName)" --appCatalogUrl "$(SiteUrl)" --appCatalogScope sitecollection --overwrite
            displayName: 'Upload Package to App Catalog'

          # 4. Dynamically retrieve App ID & Deploy
          - script: |
              APP_ID=$(m365 spo app list --appCatalogScope sitecollection --appCatalogUrl "$(SiteUrl)" --query "[?contains(Title, '$(DynamicSpPkgName)') || contains(Filename, '$(DynamicSpPkgName)')].Id | [0]" -o raw)
              
              if [ -z "$APP_ID" ]; then
                APP_ID=$(m365 spo app list --appCatalogScope sitecollection --appCatalogUrl "$(SiteUrl)" --query "[0].Id" -o raw)
              fi
              
              echo "Deploying App ID: $APP_ID"
              m365 spo app deploy --id $APP_ID --appCatalogScope sitecollection --appCatalogUrl "$(SiteUrl)"
            displayName: 'Deploy and Activate SPFx Package'